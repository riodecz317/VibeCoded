<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Metro Manila Transit Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0c0f1a;
    --panel: #111827;
    --panel2: #1a2236;
    --border: #1e2d45;
    --text: #e2e8f0;
    --muted: #64748b;
    --fx: #f59e0b;
    --puv: #22d3ee;
    --bus: #4ade80;
    --p2p: #c084fc;
    --accent: #3b82f6;
    --danger: #f87171;
    --card-hover: #1e2d45;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* HEADER */
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:0 20px; height:56px; display:flex; align-items:center; justify-content:space-between; z-index:1000; flex-shrink:0; }
  .logo { font-family:'Space Mono',monospace; font-size:15px; font-weight:700; letter-spacing:-0.5px; }
  .logo span { color:var(--accent); }
  .logo .dot { color:var(--fx); }
  .header-right { display:flex; gap:10px; align-items:center; }
  .badge-row { display:flex; gap:6px; }
  .badge { font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; letter-spacing:0.5px; }
  .badge.fx { background:rgba(245,158,11,0.15); color:var(--fx); border:1px solid rgba(245,158,11,0.3); }
  .badge.puv { background:rgba(34,211,238,0.15); color:var(--puv); border:1px solid rgba(34,211,238,0.3); }
  .badge.bus { background:rgba(74,222,128,0.15); color:var(--bus); border:1px solid rgba(74,222,128,0.3); }
  .badge.p2p { background:rgba(192,132,252,0.15); color:var(--p2p); border:1px solid rgba(192,132,252,0.3); }

  /* LAYOUT */
  .app { display:flex; flex:1; overflow:hidden; }

  /* SIDE PANEL */
  .panel { width:340px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

  /* SEARCH */
  .search-box { padding:14px; border-bottom:1px solid var(--border); }
  .search-wrap { position:relative; }
  .search-wrap input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 36px 9px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; transition:border-color 0.2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--muted); }
  .search-icon { position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none; }
  .search-results { background:var(--panel2); border:1px solid var(--border); border-radius:8px; margin-top:6px; max-height:180px; overflow-y:auto; display:none; }
  .search-results.active { display:block; }
  .search-result-item { padding:10px 14px; cursor:pointer; font-size:12px; border-bottom:1px solid var(--border); transition:background 0.15s; }
  .search-result-item:last-child { border-bottom:none; }
  .search-result-item:hover { background:var(--card-hover); }
  .search-result-item .stop-name { font-weight:600; }
  .search-result-item .route-name { color:var(--muted); font-size:11px; margin-top:2px; }

  /* TABS */
  .tabs { display:flex; padding:10px 14px 0; gap:4px; border-bottom:1px solid var(--border); }
  .tab { font-size:11px; font-weight:600; padding:6px 10px; border-radius:6px 6px 0 0; cursor:pointer; letter-spacing:0.3px; border:1px solid transparent; border-bottom:none; transition:all 0.2s; color:var(--muted); }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--text); background:var(--panel2); border-color:var(--border); }
  .tab[data-tab="all"].active { color:var(--accent); }
  .tab[data-tab="fx"].active { color:var(--fx); }
  .tab[data-tab="puv"].active { color:var(--puv); }
  .tab[data-tab="bus"].active { color:var(--bus); }
  .tab[data-tab="p2p"].active { color:var(--p2p); }

  /* ROUTE LIST */
  .route-list { flex:1; overflow-y:auto; padding:10px; }
  .route-list::-webkit-scrollbar { width:4px; }
  .route-list::-webkit-scrollbar-track { background:transparent; }
  .route-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .route-card { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden; }
  .route-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .route-card.fx::before { background:var(--fx); }
  .route-card.puv::before { background:var(--puv); }
  .route-card.bus::before { background:var(--bus); }
  .route-card.p2p::before { background:var(--p2p); }
  .route-card:hover, .route-card.selected { background:var(--card-hover); border-color:var(--accent); }
  .route-card.selected { border-color:var(--accent); }
  .rc-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .rc-name { font-size:13px; font-weight:600; line-height:1.3; }
  .rc-gate { font-family:'Space Mono',monospace; font-size:10px; padding:2px 6px; border-radius:4px; background:rgba(59,130,246,0.15); color:var(--accent); border:1px solid rgba(59,130,246,0.25); flex-shrink:0; margin-left:8px; }
  .rc-sched { font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; gap:4px; }
  .rc-stops { display:flex; flex-wrap:wrap; gap:4px; }
  .stop-tag { font-size:10px; padding:2px 7px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--muted); }

  /* ADD ROUTE BTN */
  .add-btn-wrap { padding:12px 14px; border-top:1px solid var(--border); }
  .add-btn { width:100%; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:background 0.2s; }
  .add-btn:hover { background:#2563eb; }

  /* MAP */
  #map { flex:1; background:#0c0f1a; }

  /* MAP INFO BOX */
  .map-info { position:absolute; bottom:20px; left:360px; z-index:1000; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; max-width:320px; display:none; }
  .map-info.active { display:block; }
  .mi-title { font-size:14px; font-weight:700; margin-bottom:6px; }
  .mi-type { font-size:11px; margin-bottom:8px; }
  .mi-row { font-size:12px; color:var(--muted); margin-bottom:4px; display:flex; gap:6px; }
  .mi-row strong { color:var(--text); }
  .mi-stops-list { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .mi-close { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; }
  .mi-close:hover { color:var(--text); }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; display:none; align-items:center; justify-content:center; }
  .modal-overlay.active { display:flex; }
  .modal { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; width:480px; max-width:95vw; max-height:90vh; overflow-y:auto; }
  .modal h2 { font-size:16px; font-weight:700; margin-bottom:16px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; letter-spacing:0.3px; }
  .form-group input, .form-group select, .form-group textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; transition:border-color 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
  .form-group select option { background:var(--panel); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-btns { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .btn-cancel { background:transparent; border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; }
  .btn-save { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:8px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-save:hover { background:#2563eb; }

  /* TOAST */
  .toast { position:fixed; bottom:20px; right:20px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; font-size:13px; z-index:3000; transform:translateY(60px); opacity:0; transition:all 0.3s; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.success { border-left:3px solid var(--bus); }

  /* CATEGORY HEADER */
  .cat-header { font-family:'Space Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; color:var(--muted); padding:8px 4px 4px; text-transform:uppercase; }

  /* LEGEND */
  .legend { position:absolute; top:68px; right:12px; z-index:1000; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 14px; }
  .legend-title { font-size:10px; font-weight:700; letter-spacing:0.5px; color:var(--muted); margin-bottom:8px; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:11px; margin-bottom:5px; }
  .legend-line { width:20px; height:3px; border-radius:2px; }

  /* STATUS INDICATOR */
  .status-dot { width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:4px; }
  .status-dot.green { background:#22c55e; }
  .status-dot.yellow { background:#eab308; }
  .status-dot.grey { background:#64748b; }

  /* ORIGIN MARKERS */
  .origin-badge { font-size:10px; font-weight:700; }
</style>
</head>
<body>

<header>
  <div class="logo">METRO<span>TRANSIT</span><span class="dot">•</span>PH</div>
  <div class="header-right">
    <div class="badge-row">
      <span class="badge fx">FX/UV Express</span>
      <span class="badge puv">PUV/PUJ</span>
      <span class="badge bus">City Bus</span>
      <span class="badge p2p">P2P Bus</span>
    </div>
  </div>
</header>

<div class="app">
  <!-- SIDE PANEL -->
  <div class="panel">
    <div class="search-box">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Search stop or landmark…" autocomplete="off"/>
        <span class="search-icon">⌕</span>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="all">All</div>
      <div class="tab" data-tab="fx">FX/UV</div>
      <div class="tab" data-tab="puv">PUV</div>
      <div class="tab" data-tab="bus">Bus</div>
      <div class="tab" data-tab="p2p">P2P</div>
    </div>

    <div class="route-list" id="routeList"></div>

    <div class="add-btn-wrap">
      <button class="add-btn" onclick="openModal()">+ Add New Route</button>
    </div>
  </div>

  <!-- MAP -->
  <div style="position:relative;flex:1;">
    <div id="map"></div>

    <!-- LEGEND -->
    <div class="legend">
      <div class="legend-title">ROUTE TYPE</div>
      <div class="legend-item"><div class="legend-line" style="background:#f59e0b"></div>FX / UV Express</div>
      <div class="legend-item"><div class="legend-line" style="background:#22d3ee"></div>PUV / PUJ</div>
      <div class="legend-item"><div class="legend-line" style="background:#4ade80"></div>City Bus</div>
      <div class="legend-item"><div class="legend-line" style="background:#c084fc"></div>P2P Bus</div>
    </div>

    <!-- MAP INFO -->
    <div class="map-info" id="mapInfo">
      <button class="mi-close" onclick="closeInfo()">✕</button>
      <div class="mi-title" id="miTitle"></div>
      <div class="mi-type" id="miType"></div>
      <div class="mi-row"><strong>Schedule:</strong> <span id="miSched"></span></div>
      <div class="mi-row" id="miGateRow"><strong>Gate:</strong> <span id="miGate"></span></div>
      <div class="mi-row"><strong>Stops:</strong></div>
      <div class="mi-stops-list" id="miStops"></div>
    </div>
  </div>
</div>

<!-- ADD ROUTE MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add New Route</h2>
    <div class="form-row">
      <div class="form-group">
        <label>ROUTE NAME</label>
        <input type="text" id="fName" placeholder="e.g. Alabang via SLEX"/>
      </div>
      <div class="form-group">
        <label>TRANSPORT TYPE</label>
        <select id="fType">
          <option value="fx">FX / UV Express</option>
          <option value="puv">PUV / PUJ</option>
          <option value="bus">City Bus</option>
          <option value="p2p">P2P Bus</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>ORIGIN HUB</label>
        <select id="fOrigin">
          <option value="ortigas">Ortigas (P. Casal St.)</option>
          <option value="ayala">One Ayala, Makati</option>
        </select>
      </div>
      <div class="form-group">
        <label>GATE</label>
        <input type="text" id="fGate" placeholder="e.g. Gate 5"/>
      </div>
    </div>
    <div class="form-group">
      <label>SCHEDULE</label>
      <input type="text" id="fSched" placeholder="e.g. Monday to Friday, 10:00 AM – 4:00 PM"/>
    </div>
    <div class="form-group">
      <label>STOPS (comma-separated)</label>
      <textarea id="fStops" rows="3" placeholder="e.g. Alabang Exit, Festival Mall, Filinvest"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveRoute()">Save Route</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

// Origin markers
function makeOriginIcon(label) {
  return L.divIcon({
    className:'', iconSize:[60,22], iconAnchor:[30,11],
    html:`<div style="background:#1e3a5f;border:1.5px solid #3b82f6;border-radius:4px;padding:2px 6px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:#60a5fa;white-space:nowrap;text-align:center;">${label}</div>`
  });
}

// ─── POLYLINES & STOP MARKERS ────────────────────────────────────────────────
const polylines = {};
const stopMarkersByRoute = {};

function makeStopIcon(color) {
  return L.divIcon({
    className:'', iconSize:[8,8], iconAnchor:[4,4],
    html:`<div style="width:8px;height:8px;border-radius:50%;background:${color};border:1.5px solid rgba(255,255,255,0.6);"></div>`
  });
}

ROUTES.forEach(r => {
  const color = TYPE_COLORS[r.type];
  const pl = L.polyline(r.coords, {
    color, weight:3, opacity:0.6, smoothFactor:1,
    dashArray: r.type==='p2p' ? '6,4' : (r.type==='bus' ? '10,4' : null)
  }).addTo(map);
  pl.on('click', () => selectRoute(r.id));
  polylines[r.id] = pl;

  // Stop markers
  const markers = [];
  r.coords.slice(1).forEach((c, i) => {
    const m = L.marker(c, { icon: makeStopIcon(color) }).addTo(map);
    m.bindTooltip(`<b>${r.stops[i] || ''}</b><br><small>${r.name}</small>`);
    m.on('click', () => selectRoute(r.id));
    markers.push(m);
  });
  stopMarkersByRoute[r.id] = markers;
});

// ─── ROUTE LIST ───────────────────────────────────────────────────────────────
let activeTab = 'all';
let selectedId = null;

function renderList(filter='') {
  const list = document.getElementById('routeList');
  list.innerHTML = '';
  const fl = filter.toLowerCase();

  const cats = [
    { key:'fx',  label:'FX / UV Express – Ortigas' },
    { key:'puv', label:'PUV / PUJ – One Ayala' },
    { key:'bus', label:'City Bus – One Ayala' },
    { key:'p2p', label:'P2P Bus – One Ayala' }
  ];

  cats.forEach(cat => {
    if (activeTab !== 'all' && activeTab !== cat.key) return;
    const routes = ROUTES.filter(r => r.type === cat.key &&
      (!fl || r.name.toLowerCase().includes(fl) || r.stops.some(s => s.toLowerCase().includes(fl))));
    if (!routes.length) return;

    const h = document.createElement('div');
    h.className = 'cat-header'; h.textContent = cat.label;
    list.appendChild(h);

    routes.forEach(r => {
      const card = document.createElement('div');
      card.className = `route-card ${r.type}${r.id===selectedId?' selected':''}`;
      card.dataset.id = r.id;
      card.innerHTML = `
        <div class="rc-header">
          <div class="rc-name">${r.name}</div>
          ${r.gate && r.gate!=='—' ? `<span class="rc-gate">${r.gate}</span>` : ''}
        </div>
        <div class="rc-sched">🕐 ${r.schedule}</div>
        <div class="rc-stops">${r.stops.slice(0,5).map(s=>`<span class="stop-tag">${s}</span>`).join('')}${r.stops.length>5?`<span class="stop-tag">+${r.stops.length-5}</span>`:''}</div>
      `;
      card.addEventListener('click', () => selectRoute(r.id));
      list.appendChild(card);
    });
  });
}

function selectRoute(id) {
  // Deselect old
  if (selectedId) {
    const r0 = ROUTES.find(r=>r.id===selectedId);
    if(r0) polylines[r0.id].setStyle({weight:3, opacity:0.6});
  }
  selectedId = id;
  const route = ROUTES.find(r=>r.id===id);
  if (!route) return;

  // Highlight polyline
  polylines[id].setStyle({weight:5, opacity:1});
  map.fitBounds(polylines[id].getBounds(), {padding:[40,40]});

  // Show info box
  document.getElementById('miTitle').textContent = route.name;
  document.getElementById('miType').innerHTML = `<span class="badge ${route.type}">${TYPE_LABELS[route.type]}</span>`;
  document.getElementById('miSched').textContent = route.schedule;
  document.getElementById('miGate').textContent = route.gate;
  document.getElementById('miGateRow').style.display = route.gate && route.gate!=='—' ? 'flex' : 'none';
  document.getElementById('miStops').innerHTML = route.stops.map(s=>`<span class="stop-tag">${s}</span>`).join('');
  document.getElementById('mapInfo').classList.add('active');

  renderList();
}

function closeInfo() {
  if (selectedId) {
    const r0 = ROUTES.find(r=>r.id===selectedId);
    if(r0) polylines[r0.id].setStyle({weight:3, opacity:0.6});
  }
  selectedId = null;
  document.getElementById('mapInfo').classList.remove('active');
  renderList();
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    renderList();
    // Filter polylines visibility
    ROUTES.forEach(r => {
      if (activeTab==='all' || activeTab===r.type) {
        polylines[r.id].addTo(map);
        stopMarkersByRoute[r.id].forEach(m=>m.addTo(map));
      } else {
        polylines[r.id].removeFrom(map);
        stopMarkersByRoute[r.id].forEach(m=>m.removeFrom(map));
      }
    });
  });
});

const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { searchResults.classList.remove('active'); return; }

  // Match stops across all routes
  const matches = [];
  const seen = new Set();
  ROUTES.forEach(r => {
    r.stops.forEach((s,i) => {
      if (s.toLowerCase().includes(q)) {
        const key = s+'|'+r.id;
        if (!seen.has(key)) {
          seen.add(key);
          matches.push({ stop:s, route:r, coordIdx:i+1 });
        }
      }
    });
  });
  // Match landmarks
  LANDMARKS.forEach(lm => {
    if (lm.name.toLowerCase().includes(q)) {
      // Find routes serving this area
      const nearby = ROUTES.filter(r =>
        r.coords.some(c => Math.abs(c[0]-lm.lat)<0.015 && Math.abs(c[1]-lm.lng)<0.015)
      );
      if (nearby.length) {
        matches.unshift({ landmark:lm, routes:nearby });
      }
    }
  });

  if (!matches.length) {
    searchResults.innerHTML = '<div class="search-result-item"><span class="stop-name">No results found</span></div>';
    searchResults.classList.add('active');
    return;
  }

  searchResults.innerHTML = matches.slice(0,10).map(m => {
    if (m.landmark) {
      return `<div class="search-result-item" data-type="landmark" data-lat="${m.landmark.lat}" data-lng="${m.landmark.lng}" data-routes="${m.routes.map(r=>r.id).join(',')}">
        <div class="stop-name">📍 ${m.landmark.name}</div>
        <div class="route-name">${m.routes.length} route(s): ${m.routes.map(r=>r.name).slice(0,3).join(', ')}${m.routes.length>3?'…':''}</div>
      </div>`;
    } else {
      return `<div class="search-result-item" data-type="stop" data-route="${m.route.id}" data-lat="${m.route.coords[m.coordIdx]?.[0]}" data-lng="${m.route.coords[m.coordIdx]?.[1]}">
        <div class="stop-name">🚏 ${m.stop}</div>
        <div class="route-name" style="color:${TYPE_COLORS[m.route.type]}">${m.route.name} · ${TYPE_LABELS[m.route.type]}</div>
      </div>`;
    }
  }).join('');
  searchResults.classList.add('active');
});

searchResults.addEventListener('click', function(e) {
  const item = e.target.closest('.search-result-item');
  if (!item) return;
  searchResults.classList.remove('active');
  searchInput.value = '';

  if (item.dataset.type === 'stop') {
    selectRoute(item.dataset.route);
    const lat = parseFloat(item.dataset.lat), lng = parseFloat(item.dataset.lng);
    if (!isNaN(lat)) map.setView([lat,lng], 15);
  } else if (item.dataset.type === 'landmark') {
    const lat = parseFloat(item.dataset.lat), lng = parseFloat(item.dataset.lng);
    map.setView([lat,lng], 15);
    // Highlight all nearby routes
    const rids = item.dataset.routes.split(',');
    const first = rids[0];
    selectRoute(first);
    // Flash others
    rids.slice(1).forEach(rid => {
      if (polylines[rid]) polylines[rid].setStyle({weight:4, opacity:0.9});
      setTimeout(() => {
        if (polylines[rid] && rid !== selectedId) polylines[rid].setStyle({weight:3, opacity:0.6});
      }, 3000);
    });
    // Show toast with all routes
    const routeNames = rids.map(rid=>ROUTES.find(r=>r.id===rid)?.name).filter(Boolean);
    showToast(`Found ${rids.length} route(s) near this area`);
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResults.classList.remove('active');
});

// ─── ADD ROUTE MODAL ─────────────────────────────────────────────────────────
function openModal() { document.getElementById('modalOverlay').classList.add('active'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function saveRoute() {
  const name = document.getElementById('fName').value.trim();
  const type = document.getElementById('fType').value;
  const origin = document.getElementById('fOrigin').value;
  const gate = document.getElementById('fGate').value.trim() || '—';
  const sched = document.getElementById('fSched').value.trim();
  const stopsRaw = document.getElementById('fStops').value.trim();
  if (!name || !sched || !stopsRaw) { showToast('Please fill in all required fields', true); return; }

  const stops = stopsRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const originCoord = origin==='ortigas' ? ORTIGAS : AYALA;
  const newRoute = {
    id: `custom-${Date.now()}`, type, name, gate,
    origin: origin==='ortigas' ? 'Ortigas' : 'One Ayala',
    schedule: sched, stops,
    coords: [originCoord]
  };
  ROUTES.push(newRoute);

  // Draw on map
  const color = TYPE_COLORS[type];
  const pl = L.polyline(newRoute.coords, { color, weight:3, opacity:0.6, dashArray:'4,4' }).addTo(map);
  pl.on('click', () => selectRoute(newRoute.id));
  polylines[newRoute.id] = pl;
  stopMarkersByRoute[newRoute.id] = [];

  renderList();
  closeModal();
  showToast(`Route "${name}" added successfully`);
  ['fName','fGate','fSched','fStops'].forEach(id=>{ document.getElementById(id).value=''; });
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? '' : ' success');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderList();
